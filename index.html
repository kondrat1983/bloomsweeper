<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fbf5e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bloomsweeper</title>
<link rel="stylesheet" href="src/app/app.css">
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <button class="iconbtn" id="back" aria-label="Back"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title" id="title">Garden</div>
    <div class="count" id="counter" aria-live="polite"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="3.2"/><circle cx="17" cy="11" r="3.2"/><circle cx="15" cy="17" r="3.2"/><circle cx="9" cy="17" r="3.2"/><circle cx="7" cy="11" r="3.2"/><circle cx="12" cy="12.5" r="1.6" fill="currentColor"/></svg><span id="counterText">0 / 0</span></div>
    <button class="iconbtn" id="menu" aria-label="Menu"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
  </header>
  <section class="canvas" id="wrap" aria-label="Page drawing">
    <div class="stage" id="stage"></div>
    <div class="zoom" id="zoom" hidden>100%</div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>
  <div class="palette" id="palette" hidden>
    <div class="seg" role="group" aria-label="Palette">
      <button id="palFlowers" class="on">Flowers</button>
      <button id="palLeaves">Leaves</button>
    </div>
    <div class="swatches" id="swatches"></div>
    <button class="auto" id="auto">Auto</button>
  </div>
  <nav class="tray" id="tray" aria-label="Creatures"></nav>
  <nav class="tools" id="tools" aria-label="Tools">
    <button class="tool" data-tool="find"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span>Find</span></button>
    <button class="tool" data-tool="bloom"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="3.2"/><circle cx="17" cy="11" r="3.2"/><circle cx="15" cy="17" r="3.2"/><circle cx="9" cy="17" r="3.2"/><circle cx="7" cy="11" r="3.2"/><circle cx="12" cy="12.5" r="1.6" fill="currentColor"/></svg><span>Bloom</span></button>
    <button class="tool" data-tool="green"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z"/><path d="M4 20L14 10M8 12l2 2M11 9l2 2"/></svg><span>Green</span></button>
    <button class="tool" data-tool="paint"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-8 8-6-6z"/><path d="M6 12l-2 6 2 2 6-2"/></svg><span>Paint</span></button>
    <button class="tool" data-tool="eraser"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5-9 9H6l-3-3z"/><path d="M9 10l5 5M11 18h9"/></svg><span>Eraser</span></button>
    <button class="tool" data-tool="hint"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17h6M10 20h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Hint</span></button>
  </nav>
</main>
<script type="module" src="src/app/main.mjs"></script>
</body>
</html>
